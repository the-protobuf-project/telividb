[package]
name = "telividb-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The telividb desktop application."

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# Windows requires. See rust-lang/cargo#8519.
name = "telividb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
telividb-desktop-engine.workspace = true
telividb-desktop-ipc.workspace = true
tauri.workspace = true
tauri-plugin-opener.workspace = true
tokio.workspace = true
