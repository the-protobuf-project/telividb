// The Point resource.
syntax = "proto3";

package episteme.point.v1;

import "episteme/shared/v1/types.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";

option java_multiple_files = true;
option java_outer_classname = "PointProto";
option java_package = "dev.episteme.point.v1";

// One vector, keyed by the field it belongs to.
message NamedVector {
  // Name of the vector field this belongs to.
  string field = 1 [(google.api.field_behavior) = REQUIRED];

  // The vector itself.
  episteme.shared.v1.Vector vector = 2 [(google.api.field_behavior) = REQUIRED];
}

// A single indexed item within a collection.
message Point {
  option (google.api.resource) = {
    type: "episteme.dev/Point"
    pattern: "collections/{collection}/points/{point}"
  };

  // Resource name of the point.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Vectors this point carries, at most one per field.
  //
  // Not every point has every field: a text-only point has no image vector,
  // and that is normal rather than exceptional.
  repeated NamedVector vectors = 2 [(google.api.field_behavior) = OPTIONAL];

  // Interval of the source media this point covers, for time-indexed content.
  episteme.shared.v1.Span span = 3 [(google.api.field_behavior) = OPTIONAL];

  // Reference to the bytes this point was derived from.
  episteme.shared.v1.ContentRef content_ref = 4 [(google.api.field_behavior) = OPTIONAL];
}

// A point that could not be accepted, with enough context to fix and resubmit.
message PointRejection {
  // Resource name of the point that was refused.
  string name = 1;

  // Machine-readable reason, such as `DIMENSION_MISMATCH`.
  string code = 2;

  // Human-readable explanation.
  string message = 3;
}
