// The Point resource.
syntax = "proto3";

package episteme.point.v1;

import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/duration.proto";

option java_multiple_files = true;
option java_outer_classname = "PointProto";
option java_package = "dev.episteme.point.v1";

// A vector, carried as raw bytes rather than a repeated scalar.
//
// Protobuf encodes a repeated scalar element by element, so a 768-dimension
// vector would cost 768 varint operations per message, in both directions, on
// the hot path. A single length-delimited field costs one.
message Vector {
  // Raw little-endian IEEE-754 single-precision components.
  //
  // Length must equal `dimensions * 4`.
  bytes data = 1 [(google.api.field_behavior) = REQUIRED];

  // Number of components, so a reader can validate before casting.
  int32 dimensions = 2 [(google.api.field_behavior) = REQUIRED];
}

// A half-open interval measured from the start of a source.
//
// Present on time-indexed media, because retrieval returns a moment in a
// recording rather than the recording itself.
message Span {
  // Inclusive start of the interval, relative to the beginning of the source
  // media referenced by the point's content reference.
  //
  // A duration rather than a timestamp: this is a position within the media,
  // not a point in wall-clock time, and the distinction matters when the same
  // recording is ingested twice.
  google.protobuf.Duration start_offset = 1 [(google.api.field_behavior) = REQUIRED];

  // Exclusive end of the interval, relative to the beginning of the source
  // media referenced by the point's content reference.
  google.protobuf.Duration end_offset = 2 [(google.api.field_behavior) = REQUIRED];
}

// A pointer to the bytes a point was derived from.
//
// The database stores this rather than the media itself: video is
// gigabyte-scale and blob storage is a solved problem. The digest is what
// detects that a source changed and its embeddings are stale.
message ContentRef {
  // Location of the source, such as `file://`, `s3://` or `https://`.
  string uri = 1 [(google.api.field_behavior) = REQUIRED];

  // First byte of the range this point covers, when it covers only part.
  int64 range_start = 2 [(google.api.field_behavior) = OPTIONAL];

  // Byte after the range this point covers.
  int64 range_end = 3 [(google.api.field_behavior) = OPTIONAL];

  // SHA-256 digest of the referenced bytes.
  bytes sha256 = 4 [(google.api.field_behavior) = OPTIONAL];

  // Source text, inlined when small enough to keep the point re-embeddable.
  //
  // Without a reachable source, a collection is locked to the model that
  // created it.
  string inline_text = 5 [(google.api.field_behavior) = OPTIONAL];
}

// One vector, keyed by the field it belongs to.
message NamedVector {
  // Identifier of the vector field this belongs to.
  string field_id = 1 [(google.api.field_behavior) = REQUIRED];

  // The vector itself.
  Vector vector = 2 [(google.api.field_behavior) = REQUIRED];
}

// A single indexed item within a collection.
message Point {
  option (google.api.resource) = {
    type: "episteme.dev/Point"
    pattern: "collections/{collection}/points/{point}"
    singular: "point"
    plural: "points"
  };

  // Resource name of the point.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Vectors this point carries, at most one per field.
  //
  // Not every point has every field: a text-only point has no image vector,
  // and that is normal rather than exceptional.
  repeated NamedVector vectors = 2 [(google.api.field_behavior) = OPTIONAL];

  // Interval of the source media this point covers, for time-indexed content.
  Span span = 3 [(google.api.field_behavior) = OPTIONAL];

  // Reference to the bytes this point was derived from.
  ContentRef content_ref = 4 [(google.api.field_behavior) = OPTIONAL];
}
