// Search request and result types for the Points service.
syntax = "proto3";

package episteme.point.v1;

import "episteme/point/v1/point.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/field_mask.proto";

option java_multiple_files = true;
option java_outer_classname = "PointSearchProto";
option java_package = "dev.episteme.point.v1";

// Why a query cost what it did.
//
// Returned so a slow or surprising result can be explained without reproducing
// it under a profiler.
message SearchStats {
  // Vectors actually scored.
  //
  // Latency tracks this far more closely than it tracks the requested page
  // size.
  int64 candidates_visited = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Candidates that were rescored at full precision after a coarse scan.
  int64 reranked_count = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Results drawn from the unsealed write buffer.
  //
  // The buffer is scanned exhaustively, so these are exact. They are reported
  // separately because counting them alongside index results would inflate any
  // recall measurement.
  int32 buffer_hit_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Results drawn from a sealed segment through its index.
  int32 index_hit_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Filter strategy the planner chose, such as `prefilter` or `traversal`.
  string filter_strategy = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One point matched by a search, with its score.
message SearchResult {
  // The matching point.
  //
  // Carries the resource itself rather than only its name, so a caller can
  // render a result without a second round trip. Vector fields are omitted
  // unless the read mask asks for them.
  Point point = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Similarity or distance, on the scale of the field's own metric.
  //
  // Whether a higher value is nearer depends on that metric.
  float score = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for searching the points of a collection.
message SearchPointsRequest {
  // Collection to search.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "episteme.dev/Point"}
  ];

  // Identifier of the vector field to search.
  //
  // Each field has its own model and metric, so a query is meaningful only
  // against the field it was encoded for.
  string field_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The query vector.
  Vector query = 3 [(google.api.field_behavior) = REQUIRED];

  // Maximum number of results to return.
  //
  // This is the `k` of a nearest-neighbour search, not merely a display limit:
  // it determines how much work the index does. The service may return fewer.
  // Zero selects a server-chosen default.
  int32 page_size = 4 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous call, to retrieve the following page.
  //
  // Paging beyond the first page re-runs the search with a larger `k`, so a
  // deep page costs more than a shallow one.
  string page_token = 5 [(google.api.field_behavior) = OPTIONAL];

  // Candidate breadth during the search.
  //
  // Larger values improve recall and cost latency on every request. Zero
  // selects a server-chosen default.
  int32 candidate_breadth = 6 [(google.api.field_behavior) = OPTIONAL];

  // Fields to return for each matched point.
  //
  // Raw vectors are omitted unless explicitly requested, because a vector can
  // be inverted toward its source text — so permission to search is not
  // permission to export.
  google.protobuf.FieldMask read_mask = 7 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for searching the points of a collection.
message SearchPointsResponse {
  // Matching points, nearest first.
  repeated SearchResult results = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Token to retrieve the next page, or empty if this is the last page.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether every source answered.
  //
  // False when a shard missed its deadline or a vault was locked. Present from
  // the first release because a caller must be able to distinguish "no
  // results" from "no results you are currently able to see", and adding it
  // later would break the most-used message in the API.
  bool complete = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Sources that answered within the deadline.
  int32 answered_source_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Sources that were consulted.
  int32 total_source_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Vaults skipped because they are locked.
  //
  // Names only, never contents.
  repeated string locked_vaults = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // What the planner did, for explain and for tuning.
  SearchStats stats = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}
