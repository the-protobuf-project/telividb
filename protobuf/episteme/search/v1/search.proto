// Search result types.
syntax = "proto3";

package episteme.search.v1;

import "episteme/shared/v1/types.proto";
import "google/api/resource.proto";

option java_multiple_files = true;
option java_outer_classname = "SearchProto";
option java_package = "dev.episteme.search.v1";

// Why a query cost what it did.
//
// Returned so a slow or surprising result can be explained without reproducing
// it under a profiler.
message SearchStats {
  // Vectors actually scored.
  //
  // Latency tracks this far more closely than it tracks the requested result
  // count.
  int64 candidates_visited = 1;

  // Candidates that were rescored at full precision after a coarse scan.
  int64 reranked_count = 2;

  // Results drawn from the unsealed write buffer.
  //
  // The buffer is scanned exhaustively, so these are exact. They are reported
  // separately because counting them alongside index results would inflate any
  // recall measurement.
  int32 buffer_hit_count = 3;

  // Results drawn from a sealed segment through its index.
  int32 index_hit_count = 4;

  // Filter strategy the planner chose, such as `prefilter` or `traversal`.
  string filter_strategy = 5;
}

// One result of a search.
message SearchResult {
  // Resource name of the matching point.
  string point = 1 [(google.api.resource_reference) = {type: "episteme.dev/Point"}];

  // Similarity or distance, on the scale of the field's own metric.
  //
  // Whether a higher value is nearer depends on that metric.
  float score = 2;

  // Interval of the source media this result covers, for time-indexed content.
  episteme.shared.v1.Span span = 3;

  // Reference to the bytes this result was derived from.
  episteme.shared.v1.ContentRef content_ref = 4;

  // The raw vector, when it was requested and permitted.
  episteme.shared.v1.Vector vector = 5;
}
