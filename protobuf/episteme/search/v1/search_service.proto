// The Search service.
syntax = "proto3";

package episteme.search.v1;

import "episteme/search/v1/search_messages.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";

option java_multiple_files = true;
option java_outer_classname = "SearchServiceProto";
option java_package = "dev.episteme.search.v1";

// Retrieves points by vector similarity.
service Search {
  option (google.api.default_host) = "episteme.dev";

  // Searches a collection for the nearest points to a query vector.
  rpc SearchCollection(SearchCollectionRequest) returns (SearchCollectionResponse) {
    option (google.api.http) = {
      post: "/v1/{collection=collections/*}:search"
      body: "*"
    };
  }

  // Runs several searches against one collection in a single request.
  rpc BatchSearchCollection(BatchSearchCollectionRequest) returns (BatchSearchCollectionResponse) {
    option (google.api.http) = {
      post: "/v1/{collection=collections/*}:batchSearch"
      body: "*"
    };
  }
}
