syntax = "proto3";

package episteme.v1;

import "episteme/v1/common.proto";

// One vector, keyed by the field it belongs to.
message NamedVector {
  string field = 1;
  Vector vector = 2;
}

message Point {
  // AIP resource name, e.g. `recordings/kn24/shots/00412`.
  string name = 1;
  // Not every point has every field — a text-only point has no image vector,
  // and that is normal rather than exceptional.
  repeated NamedVector vectors = 2;
  optional Span span = 3;
  optional ContentRef content = 4;
}

message UpsertRequest {
  string collection = 1;
  repeated Point points = 2;
}

message UpsertResponse {
  uint64 accepted = 1;
  // Points refused, with a reason each. One bad record does not fail a batch.
  repeated Rejection rejections = 2;
}

// A point that could not be accepted, with enough context to fix and resubmit.
message Rejection {
  string name = 1;
  string code = 2;
  string message = 3;
}

message GetRequest {
  string collection = 1;
  repeated string names = 2;
  bool include_vectors = 3;
}

message GetResponse {
  repeated Point points = 1;
  // Names that matched nothing, distinguished from names refused by policy —
  // which are simply absent, since reporting them would confirm they exist.
  repeated string not_found = 2;
}

message DeleteRequest {
  string collection = 1;
  repeated string names = 2;
}

message DeleteResponse {
  uint64 deleted = 1;
  // Deletion writes a tombstone; the bytes survive until compaction. A caller
  // needing erasure must force compaction and check for its completion.
  bool compaction_required_for_erasure = 2;
}

// Point lifecycle.
service PointService {
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
