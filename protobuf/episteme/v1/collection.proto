syntax = "proto3";

package episteme.v1;

import "episteme/v1/common.proto";

// One named vector field within a point type.
message VectorFieldSpec {
  // Field name, e.g. `image_clip`. Unique within a point type.
  string name = 1;
  uint32 dim = 2;
  Metric metric = 3;
  IndexKind index = 4;
  Codec codec = 5;
  // Model that produces vectors for this field.
  string model = 6;
  // Encoder that handles queries against this field.
  //
  // For a joint model this is the other tower: searching an image field with
  // text must encode that text with the model's text tower. Declared rather
  // than left to convention because getting it wrong yields plausible garbage
  // rather than an error.
  optional string query_encoder = 7;
  // Permission gating access to raw vectors of this field. Per-field because a
  // voiceprint is biometric data where a transcript is not.
  optional string permission = 8;
}

message CreateCollectionRequest {
  string name = 1;
  // Serialized `FileDescriptorSet`. The engine never parses `.proto` — a
  // generator produces this and it is stored verbatim as the schema of record.
  bytes descriptor_set = 2;
  repeated VectorFieldSpec vector_fields = 3;
}

message CreateCollectionResponse {
  string name = 1;
  // Digest of the canonicalized descriptor set, mirrored into every segment
  // written under it.
  bytes schema_fingerprint = 2;
}

message DescribeCollectionRequest {
  string name = 1;
}

message DescribeCollectionResponse {
  string name = 1;
  bytes schema_fingerprint = 2;
  repeated VectorFieldSpec vector_fields = 3;
  uint64 rows_live = 4;
  uint64 rows_tombstoned = 5;
  uint32 segments = 6;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated string names = 1;
}

message DropCollectionRequest {
  string name = 1;
}

message DropCollectionResponse {}

// Collection lifecycle.
service CollectionService {
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc DescribeCollection(DescribeCollectionRequest) returns (DescribeCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc DropCollection(DropCollectionRequest) returns (DropCollectionResponse);
}
