// Value types shared across every episteme resource.
syntax = "proto3";

package episteme.shared.v1;

import "google/protobuf/duration.proto";

option java_multiple_files = true;
option java_outer_classname = "TypesProto";
option java_package = "dev.episteme.shared.v1";

// A vector, carried as raw bytes rather than a repeated scalar.
//
// Protobuf encodes a repeated scalar element by element, so a 768-dimension
// vector would cost 768 varint operations per message, in both directions, on
// the hot path. A single length-delimited field costs one.
message Vector {
  // Raw little-endian IEEE-754 single-precision components.
  //
  // Length must equal `dimensions * 4`.
  bytes data = 1;

  // Number of components, so a reader can validate before casting.
  int32 dimensions = 2;
}

// A half-open interval measured from the start of a source.
//
// Present on time-indexed media, because retrieval returns a moment in a
// recording rather than the recording itself.
message Span {
  // Inclusive start of the interval, relative to the beginning of the source
  // media referenced by the point's content reference.
  //
  // A duration rather than a timestamp: this is a position within the media,
  // not a point in wall-clock time, and the distinction matters when the same
  // recording is ingested twice.
  google.protobuf.Duration start_offset = 1;

  // Exclusive end of the interval, relative to the beginning of the source
  // media referenced by the point's content reference.
  google.protobuf.Duration end_offset = 2;
}

// A pointer to the bytes a point was derived from.
//
// The database stores this rather than the media itself: video is
// gigabyte-scale and blob storage is a solved problem. The digest is what
// detects that a source changed and its embeddings are stale.
message ContentRef {
  // Location of the source, such as `file://`, `s3://` or `https://`.
  string uri = 1;

  // First byte of the range this point covers, when it covers only part.
  int64 range_start = 2;

  // Byte after the range this point covers.
  int64 range_end = 3;

  // SHA-256 digest of the referenced bytes.
  bytes sha256 = 4;

  // Source text, inlined when small enough to keep the point re-embeddable.
  //
  // Without a reachable source, a collection is locked to the model that
  // created it.
  string inline_text = 5;
}
