# Short names for the things worth running.
#
# `default-members` would make a bare `cargo run` work, but it also narrows
# what a bare `cargo test` covers — from 400 tests to 5, silently, while still
# printing "ok". A convenience is not worth a check that looks green while
# testing almost nothing, so the binaries get explicit names instead.
[alias]
xtask = "run --package xtask --"

# Start the server. Flags pass straight through: `cargo serve --addr 0.0.0.0:7700`
serve = "run --release --package telividb-server --bin telividb --"

# The same, unoptimized and verbose. Verbosity is a log level in the telemetry
# stack — CLAUDE.md rule 41 — so this passes one rather than the `--log` filter
# string it used to, which `args::parse` rejects as an unknown flag.
dev = "run --package telividb-server --bin telividb -- --environment development --log-level debug"

# Measure recall against exhaustive search.
recall = "run --release --package telividb-index --bin recall --"

# LLVM for every C dependency that reaches the build.
#
# Invariant 1 permits exactly two native paths — the MCAP/lz4 chain and
# candle's `tokenizers` -> `onig_sys`. Both compile through whatever `cc`
# finds, which is gcc on most Linux runners and clang on macOS. Pinning both
# to LLVM means one compiler's diagnostics, one set of flags, and no
# platform-dependent divergence in how those two C libraries are built.
#
# Set here rather than only in CI so a local build matches what CI produces.
[env]
CC = "clang"
CXX = "clang++"
