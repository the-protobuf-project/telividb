name: API lint

# The `.proto` files are the API's source of truth, so they are linted like
# code. AIP conformance matters more here than style: resource names are the
# system's external identity, and a name that drifts from AIP-122 breaks the
# guarantee that a resource means the same thing to every projection of the
# schema.

on:
  pull_request:
    paths:
      - "proto/**/*.proto"
      - ".github/workflows/api-lint.yml"
  push:
    branches: [main]
    paths:
      - "proto/**/*.proto"

permissions:
  contents: read

jobs:
  lint:
    name: google-api-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: the-protobuf-project/setup-google-api-linter@v1.0.0
        with:
          paths: proto/**/*.proto
          # Imports are written relative to the module root, e.g.
          # `episteme/v1/common.proto`, so the linter needs `proto/` on its
          # search path or it cannot resolve them.
          proto-paths: proto
          # Strict mode: in-proto `(-- api-linter: ... --)` comments are ignored.
          #
          # This makes CLAUDE.md rule 38 mechanical rather than a promise. A
          # suppression cannot be added to make a build green, because the
          # linter will not honour one — so a firing rule has to be answered by
          # changing the API, which is the only correct response.
          ignore-comment-disables: true

  buf:
    name: buf format · breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          # No lint. The AIP linter above owns the API surface; running a second
          # linter means two opinions and, eventually, a suppression added to
          # reconcile them — which is the one thing never allowed here.
          lint: false
          format: true
          # A shipped field number is permanent: a segment written under an
          # older schema still names its fields by number, so renumbering
          # reinterprets stored data rather than failing.
          breaking: true
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"

  generated:
    name: generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install protoc-gen-prost protoc-gen-tonic --locked
      # Committed generation only helps if the committed output is actually
      # current. This is what makes that true rather than hoped for.
      - run: cargo xtask check-proto
