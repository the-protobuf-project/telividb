name: Schema

# The schema is the API's source of truth, so it is linted and checked like
# code. AIP conformance matters more here than style: a resource name is the
# system's external identity, and a name that drifts from AIP-122 breaks the
# guarantee that a resource means the same thing in every projection of it.

on:
  pull_request:
    paths:
      - "buffers/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "buffers.yaml"
      - ".github/workflows/schema.yml"
  push:
    branches: [main]
    paths:
      - "buffers/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: google-api-linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: the-protobuf-project/setup-google-api-linter@v1.0.0
        with:
          # Run from the module root, not the repository root.
          #
          # AIP-191 checks that a file's path matches its package, and the path
          # it sees is the one given on the command line. From the repository
          # root that path is `buffers/protobuf/telividb/point/v1/...` against package
          # `telividb.point.v1` — a mismatch on the `buffers/protobuf/` prefix alone.
          #
          # Normally an import path strips that prefix, but `buf: true`
          # replaces the import paths with the export directory, so nothing
          # strips it and every file fails. Running from here makes the path
          # `telividb/point/v1/...`, which matches both the package and the
          # export layout.
          working-directory: buffers/protobuf
          paths: telividb/**/*.proto
          proto-paths: .
          # Resolve `google/api/*` through `buf export`. Without it every
          # annotation import fails, and each failure cascades into a "cannot
          # find" for every annotation in the file — one missing path reads as
          # a hundred errors.
          buf: true
          buf-input: ../..
          buf-config: ../../buf.yaml
          # Pinned, not `latest`. A newer linter adds rules, so an unpinned
          # version means CI can start failing on a commit that changed
          # nothing — and a local install three versions behind will not
          # reproduce it. `cargo xtask lint-proto` checks for the same version.
          version: "2.3.1"
          # Strict mode: in-proto `(-- api-linter: ... --)` comments are
          # ignored.
          #
          # This makes CLAUDE.md rule 38 mechanical rather than a promise. A
          # suppression cannot be added to make a build green, because the
          # linter will not honour one — so a firing rule has to be answered by
          # changing the API, which is the only correct response.
          ignore-comment-disables: true

  buf:
    name: buf format · breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Breaking-change detection needs a baseline. Before the protos first
      # land on `main` there is none, and `buf breaking` fails with "had no
      # .proto files" — which is not a breakage, only an absence.
      #
      # Checked rather than hard-coded so this enables itself on the commit
      # after the protos merge, instead of waiting for someone to notice.
      - id: baseline
        run: |
          if git ls-tree -r origin/main --name-only | grep -q '\.proto$'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No protos on main yet; skipping breaking-change detection."
          fi

      - uses: bufbuild/buf-action@v1
        with:
          # Pinned rather than `latest`, for the same reason api-linter is: a
          # new release can add a check, and CI failing on a commit that
          # changed nothing is indistinguishable from a real regression.
          version: 1.72.0
          # The action posts a summary comment by default, which needs
          # `pull-requests: write`. A lint workflow should not hold write
          # permission on pull requests, and the token is read-only for fork
          # pull requests regardless — so the comment would fail there even if
          # it were granted. The check status already reports the result.
          pr_comment: false
          # No lint. The AIP linter above owns the API surface; running a
          # second linter means two opinions and, eventually, a suppression
          # added to reconcile them — which is the one thing never allowed
          # here.
          lint: false
          format: true
          # A shipped field number is permanent: a segment written under an
          # older schema still names its fields by number, so renumbering
          # reinterprets stored data rather than failing.
          breaking: ${{ steps.baseline.outputs.exists }}
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"


  # Committed generation only helps if the committed output is actually current.
  #
  # Scoped to what is reproducible. `buf` is pinned by the action and `buffers`
  # by its module version, so both produce byte-identical output on any runner —
  # a drift here is a real "someone edited a .proto and did not regenerate".
  #
  # The Rust that `capnpc-rust` and `flatc` emit is deliberately NOT compared.
  # Those come from apt, their versions move independently of anything in this
  # repository, and their output carries a version stamp — so a routine image
  # update would fail a build that changed nothing, which is indistinguishable
  # from a real regression and trains everyone to ignore the check. That code is
  # still verified: `build.yml` compiles every feature combination of it.
  codegen:
    name: generated code · docs are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          version: 1.72.0
          setup_only: true
      # No toolchain action. `rust-toolchain.toml` is authoritative and rustup
      # honours it — naming a version twice is how the two come to disagree.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true

      # Both plugins compile from source, which is the slowest step here. They
      # change only when the pinned versions do, so cache the binaries.
      - id: plugins
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/protoc-gen-prost
            ~/.cargo/bin/protoc-gen-tonic
            ~/.cargo/bin/capnpc-rust
          key: proto-plugins-${{ runner.os }}-prost0.5.0-tonic0.5.0-capnpc0.21
      # `capnpc-rust` is the Cap'n Proto Rust backend. Cap'n Proto ships only
      # its C++ generator; every other language is a separate plugin, and
      # without this one `buffers generate` stops at the capnp target.
      - if: steps.plugins.outputs.cache-hit != 'true'
        run: |
          cargo install protoc-gen-prost@0.5.0 protoc-gen-tonic@0.5.0 --locked
          cargo install capnpc --locked

      # Pinned to the version whose output is committed. `@latest` would mean a
      # release upstream silently rewrites this repository's generated code.
      # The renderer, pinned to the version whose output is committed. `@latest`
      # would let an upstream release silently rewrite this repository's code.
      #
      # `flatc` and `capnp` come with it because the renderer invokes them to
      # compile each emitted schema into Rust — there is no schema-only mode.
      # Their *output* is still not compared, for the reason above; they are
      # installed so the command can complete, not so its Rust can be checked.
      - name: install the schema renderer and its compilers
        run: |
          sudo apt-get update -qq
          # `libcapnp-dev` is not optional: it ships `capnp/c++.capnp`, which
          # every generated schema imports for the `$Cxx.namespace` annotation.
          # Without it `capnp compile` fails on the first file with an import
          # error, which reads like a bug in the schema rather than a missing
          # package.
          sudo apt-get install -y --no-install-recommends \
            capnproto libcapnp-dev flatbuffers-compiler
          go install github.com/the-protobuf-project/buffers/plugin/cmd/buffers@v0.2.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # One command, because ordering matters and duplicating it here is how
      # the two drift. `buf generate` cleans its output directory, so the
      # descriptor set has to be rebuilt after it rather than before — the
      # xtask knows that; a hand-written sequence in this file would have to
      # learn it again.
      - name: regenerate every rendering
        run: cargo xtask gen-buffers

      - name: the committed schema is current
        run: |
          # Scoped to what is reproducible: `buf` is pinned by the action and
          # `buffers` by its module version, so both are byte-identical on any
          # runner. The Rust that capnpc-rust and flatc emit is excluded — see
          # the note on this job.
          paths='crates/platform/telividb-buffers/src/generated/protobuf
                 buffers/capnp
                 buffers/flatbuffers
                 buffers.lock'
          if ! git diff --quiet -- $paths; then
            echo "::error::the committed schema does not match the protos."
            echo "Run \`cargo xtask gen-buffers\` and commit the result."
            git diff --stat -- $paths
            exit 1
          fi
          echo "protobuf, capnp and flatbuffers renderings are all current"

      # The ordinal ledger is the only thing keeping a field in the same slot
      # across three numbering schemes that do not correspond.
      - name: no field slot has moved
        run: buffers verify

      - run: cargo xtask check-protodoc
