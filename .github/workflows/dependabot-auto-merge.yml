name: Dependabot auto-merge

# Enables GitHub's native auto-merge on Dependabot PRs that are safe to take
# unattended. GitHub then merges the PR *only* once every required status check
# passes — see the note at the bottom, because that guarantee depends on a
# branch protection rule that this file cannot create.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only Dependabot's own PRs. A PR merely touching Cargo.toml does not
    # qualify.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read what kind of update this is
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor updates are taken unattended. Majors are not: a major
      # bump is where an on-disk format, a hash output, or a trait signature
      # changes, and every one of those wants a human read.
      #
      # The `no C toolchain` job in CI is the real backstop here — it is what
      # catches a bump that quietly pulls `cc` into the default build, which is
      # exactly the kind of regression an unattended merge would otherwise ship.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major updates for review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump — not auto-merged. Check for on-disk format, \
            hash output, or trait signature changes before merging."
          gh pr edit "$PR_URL" --add-label "needs-review"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
