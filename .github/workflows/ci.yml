name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # LLVM for the two sanctioned native paths (CLAUDE.md rule 1), matching the
  # `[env]` block in `.cargo/config.toml` so a local build and a CI build
  # compile them the same way rather than diverging on the runner's default.
  CC: clang
  CXX: clang++

# Cancel a run when a newer commit lands on the same branch.
#
# A full matrix build is minutes of runner time, and the result of an
# already-superseded commit is never looked at. `group` is keyed on the
# workflow and the ref, so pushes to different branches never cancel each
# other.
#
# `main` is deliberately excluded from cancellation: its runs are the baseline
# `buf breaking` compares against, and a cancelled one leaves no record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The default build must need no C toolchain, no CMake, no CUDA SDK.
  #
  # macOS is a first-class target rather than an afterthought: on Apple silicon
  # the binary runs natively, because containers get no GPU there. Linux ARM64
  # is here because Jetson is CUDA-on-aarch64 and Graviton is ordinary
  # deployment — an aarch64 regression must not be discovered on the device.
  #
  # Windows is deliberately out of scope.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux · x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux · arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos · arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      # `submodules: recursive` because `telividb-compute` vendors ggml and
      # builds it with CMake. Without it the vendor directory is empty, CMake
      # fails, and every job that compiles the workspace fails with it — the
      # default feature set reaches `telividb-compute` through
      # `telividb-index`'s `gpu`, so this is not an opt-in path.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # No toolchain version here — rust-toolchain.toml is authoritative and
      # rustup honours it. Stated twice, the two would eventually disagree.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Save the cache even when the job fails. Without this a failing
          # build discards everything it compiled, so the next attempt starts
          # cold — which is exactly when a fast rebuild matters most.
          cache-on-failure: true

      - name: Confirm the architecture under test
        run: |
          echo "runner arch : $(uname -m)"
          echo "rust target : ${{ matrix.target }}"
          rustc --print cfg | grep -E 'target_arch|target_endian|target_pointer_width'

      - run: cargo build --workspace --all-targets --target ${{ matrix.target }}

      # Both feature sets, because neither is a superset of the other: they
      # change which `#[cfg(feature = ...)]` code compiles. `telividb-index`
      # without `parallel` takes the sequential builder, which is the
      # configuration every embedded caller gets, and without `gpu` it takes
      # the pure-Rust flat path with no candle in the tree at all (rule 46
      # keeps that configuration supported, so it has to be *run*, not just
      # built).
      #
      # Deliberately not `--all-features`. The only thing it adds over the
      # defaults is `cuda`, which pulls `cudarc` and panics in its build script
      # without `nvcc` on PATH — so on a runner with no CUDA SDK that flag can
      # only ever fail. CUDA is opt-in by design (rule 46) and is not
      # CI-verifiable here; it needs a GPU runner to mean anything.
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo test --workspace --no-default-features --target ${{ matrix.target }}

  lint:
    name: fmt · clippy
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` because `telividb-compute` vendors ggml and
      # builds it with CMake. Without it the vendor directory is empty, CMake
      # fails, and every job that compiles the workspace fails with it — the
      # default feature set reaches `telividb-compute` through
      # `telividb-index`'s `gpu`, so this is not an opt-in path.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo fmt --all --check
      # Not `--all-features`: see the test job. `cuda` cannot build without the
      # CUDA SDK, so linting both real configurations is the useful pair.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings

  # Structural rules from CLAUDE.md, enforced because rules that depend on
  # discipline decay.
  structure:
    name: file length · doc coverage · layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo xtask check-len
      - run: cargo xtask check-docs
      # Invariant 14. Nothing else enforces the dependency direction.
      - run: cargo xtask check-layers


  # No *unexpected* native build dependency. The original "no C toolchain at
  # all" promise is gone — `telividb-compute` vendors ggml and builds it with
  # CMake, deliberately, for hardware coverage (CLAUDE.md rule 42). What is
  # still worth enforcing, and what this checks, is that no *new* native path
  # appears without being a recorded decision.
  no-native-deps:
    name: no C toolchain
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` because `telividb-compute` vendors ggml and
      # builds it with CMake. Without it the vendor directory is empty, CMake
      # fails, and every job that compiles the workspace fails with it — the
      # default feature set reaches `telividb-compute` through
      # `telividb-index`'s `gpu`, so this is not an opt-in path.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - name: Fail if an unexpected native build dependency crept in
        run: |
          set -euo pipefail

          # Native builders reach the tree through these sanctioned paths:
          #   telemetry -> mcap -> {lz4 -> lz4-sys, zstd -> zstd-sys}
          #   candle-core -> tokenizers -> onig -> onig_sys
          #   telividb-compute -> {cmake, bindgen}   (ggml — rules 1 and 42)
          #
          # None is optional. MCAP recording is part of the telemetry stack
          # mandated by rule 41; `tokenizers` is a hard dependency of
          # candle-core and Cargo's feature union means it cannot be switched
          # off from here; ggml is the deliberate choice of rule 42. Each is
          # recorded in CLAUDE.md rule 1 rather than the check being deleted,
          # so a *further* native dependency still fails the build.
          #
          # **Direct dependents, not the whole inverted tree.** The transitive
          # closure of `cc` contains nearly every crate in the workspace,
          # because the telemetry stack reaches all of them — so an allowlist
          # covering it had to permit `telividb-[a-z]+` wholesale, and a new
          # native dependency introduced through one of our own crates then
          # passed silently. Only the packages whose own build script invokes
          # the builder are listed below, which is a small and stable set.
          case_allowed() {
            case "$1" in
              cc)      echo 'cc|cmake|lz4-sys|onig_sys|zstd-sys' ;;
              cmake)   echo 'cmake|telividb-compute' ;;
              bindgen) echo 'bindgen|telividb-compute' ;;
              *)       echo '' ;;
            esac
          }

          status=0
          for pkg in cc cmake bindgen; do
            allowed=$(case_allowed "$pkg")

            # Empty output means the package is not in the tree at all.
            tree=$(cargo tree --workspace --edges normal,build --invert "$pkg" \
              --depth 1 --prefix none 2>/dev/null || true)
            [ -n "$tree" ] || continue

            # First field of each line is the package name; `(*)` marks a
            # repeat of a subtree already printed.
            unexpected=$(printf '%s\n' "$tree" \
              | awk 'NF { print $1 }' \
              | sort -u \
              | grep -Ev "^($allowed)$" || true)

            if [ -n "$unexpected" ]; then
              echo "::error::$pkg is invoked directly by an unsanctioned package:"
              printf '%s\n' "$unexpected"
              echo "--- direct dependents of $pkg ---"
              printf '%s\n' "$tree"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "Rule 1 sanctions exactly three native paths: the MCAP chain"
            echo "under the telemetry stack, tokenizers/onig_sys under"
            echo "candle-core, and ggml under telividb-compute. Anything else"
            echo "needs a decision recorded in CLAUDE.md, not an addition to"
            echo "this list."
            exit 1
          fi
          echo "no unexpected native build dependencies"

      # The guard above only means something if it can fail. A dependency that
      # drags in a C toolchain by a new path must break the build, so that is
      # rehearsed here rather than assumed.
      - name: Prove the guard fails on a new native dependency
        run: |
          set -euo pipefail
          cp crates/domain/telividb-core/Cargo.toml /tmp/core-manifest.bak
          # `ring` builds with `cc` and has nothing to do with MCAP.
          printf '\nring = "0.17"\n' >> crates/domain/telividb-core/Cargo.toml

          if cargo tree --workspace --edges normal,build --invert cc --depth 1 \
             --prefix none 2>/dev/null | awk 'NF { print $1 }' | sort -u \
             | grep -Eqv '^(cc|cmake|lz4-sys|onig_sys|zstd-sys)$'; then
            echo "guard correctly detects a new native path"
          else
            echo "::error::the no-C-toolchain guard did not detect an added cc dependency"
            cp /tmp/core-manifest.bak crates/domain/telividb-core/Cargo.toml
            exit 1
          fi
          cp /tmp/core-manifest.bak crates/domain/telividb-core/Cargo.toml

  toolchain:
    name: toolchain is pinned
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` because `telividb-compute` vendors ggml and
      # builds it with CMake. Without it the vendor directory is empty, CMake
      # fails, and every job that compiles the workspace fails with it — the
      # default feature set reaches `telividb-compute` through
      # `telividb-index`'s `gpu`, so this is not an opt-in path.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify the running compiler matches the pin
        run: |
          pinned=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' rust-toolchain.toml | tr -d '"')
          actual=$(rustc --version | cut -d' ' -f2)
          echo "pinned: $pinned"
          echo "actual: $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::rustup did not honour rust-toolchain.toml"
            exit 1
          fi
      - name: Verify Cargo.toml agrees with the pin
        run: |
          pinned=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' rust-toolchain.toml | tr -d '"')
          declared=$(grep -oE 'rust-version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          echo "toolchain: $pinned  cargo: $declared"
          [ "$pinned" = "$declared" ] || {
            echo "::error::rust-version in Cargo.toml disagrees with rust-toolchain.toml"
            exit 1
          }

  # Crash-consistency and telemetry-leak suites are slow enough to be worth
  # naming separately, so a failure is legible in the checks list rather than
  # buried in a full run.
  invariants:
    name: crash consistency · telemetry leaks
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive` because `telividb-compute` vendors ggml and
      # builds it with CMake. Without it the vendor directory is empty, CMake
      # fails, and every job that compiles the workspace fails with it — the
      # default feature set reaches `telividb-compute` through
      # `telividb-index`'s `gpu`, so this is not an opt-in path.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo test -p telividb-storage --test crash_consistency
      - run: cargo test -p telividb-storage --test buffer_visibility
      - run: cargo test -p telividb-storage --test segment_roundtrip
      - run: cargo test -p telividb-storage --test graph_roundtrip
      - run: cargo test -p telividb-index  --test telemetry_leaks
      - run: cargo test -p telividb-server --test wiring

  # Recall is the only number that makes an ANN change meaningful. Release mode
  # because a debug-built graph is too slow to measure at a useful size.
  recall:
    name: hnsw recall
    runs-on: ubuntu-latest
    steps:
      # See the `test` job: without the ggml submodule, CMake has nothing to
      # build and every workspace compile fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          # Release artifacts live in a different directory from debug ones, so
          # sharing a key with the debug jobs would store both and hit neither.
          shared-key: release
          cache-on-failure: true
      - run: cargo test -p telividb-index --test hnsw_recall --release -- --nocapture
      - run: cargo test -p telividb-index --test hnsw_distribution --release -- --nocapture
      - run: cargo test -p telividb-index --test hnsw_persist --release
      # The batched builder has its own recall floor per batch size. It was
      # absent from this gate while the first batch of every build was being
      # orphaned wholesale, so nothing here noticed recall at 0.57.
      - run: cargo test -p telividb-index --test hnsw_parallel --release -- --nocapture
      - run: cargo test -p telividb-storage --test codec_recall --release -- --nocapture
      - run: cargo test -p telividb-storage --test two_tier_recall --release -- --nocapture

  # The GPU index, exercised on its CPU fallback.
  #
  # No Linux runner here has a GPU, and that is precisely what makes this worth
  # running: the `gpu` feature is on by default, so `best_device` must resolve
  # to CPU and still return the same neighbours as exhaustive search. Metal is
  # covered by the macOS leg of the `test` matrix, where it is compiled in
  # automatically; CUDA is verified on real hardware by hand, because no runner
  # here has it.
  gpu:
    name: gpu index · cpu fallback
    runs-on: ubuntu-latest
    steps:
      # See the `test` job: without the ggml submodule, CMake has nothing to
      # build and every workspace compile fails.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo test -p telividb-index -- --nocapture
      # The no-GPU build must keep working: it is the escape hatch for anyone
      # who does not want candle's weight, and a feature that became load-
      # bearing without anyone noticing would only surface here.
      - name: the workspace still builds without candle
        run: |
          cargo build -p telividb-index --no-default-features --features parallel
          if cargo tree -p telividb-index --no-default-features --features parallel \
             --edges normal | grep -qi candle; then
            echo "::error::candle is reachable even with default features off"
            exit 1
          fi
          echo "no-default-features build is candle-free"
      - name: Recall gate at 128 dimensions
        run: cargo run --release -p telividb-index --bin recall -- --rows 20000 --dim 128 --ef 64
