name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Cancel a run when a newer commit lands on the same branch.
#
# A full matrix build is minutes of runner time, and the result of an
# already-superseded commit is never looked at. `group` is keyed on the
# workflow and the ref, so pushes to different branches never cancel each
# other.
#
# `main` is deliberately excluded from cancellation: its runs are the baseline
# `buf breaking` compares against, and a cancelled one leaves no record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The default build must need no C toolchain, no CMake, no CUDA SDK.
  #
  # macOS is a first-class target rather than an afterthought: on Apple silicon
  # the binary runs natively, because containers get no GPU there. Linux ARM64
  # is here because Jetson is CUDA-on-aarch64 and Graviton is ordinary
  # deployment — an aarch64 regression must not be discovered on the device.
  #
  # Windows is deliberately out of scope.
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux · x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux · arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos · arm64
            os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      # No toolchain version here — rust-toolchain.toml is authoritative and
      # rustup honours it. Stated twice, the two would eventually disagree.
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          # Save the cache even when the job fails. Without this a failing
          # build discards everything it compiled, so the next attempt starts
          # cold — which is exactly when a fast rebuild matters most.
          cache-on-failure: true

      - name: Confirm the architecture under test
        run: |
          echo "runner arch : $(uname -m)"
          echo "rust target : ${{ matrix.target }}"
          rustc --print cfg | grep -E 'target_arch|target_endian|target_pointer_width'

      - run: cargo build --workspace --all-targets --target ${{ matrix.target }}

      # Both feature sets, because `--all-features` is *not* a superset of the
      # default run: it changes which `#[cfg(feature = ...)]` code compiles.
      # `episteme-index` without `parallel` takes the sequential builder, which
      # is the configuration every embedded caller gets, and running only
      # `--all-features` left it compile-checked but never executed.
      - run: cargo test --workspace --target ${{ matrix.target }}
      - run: cargo test --workspace --all-features --target ${{ matrix.target }}

  lint:
    name: fmt · clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # Structural rules from CLAUDE.md, enforced because rules that depend on
  # discipline decay.
  structure:
    name: file length · doc coverage · layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo xtask check-len
      - run: cargo xtask check-docs
      # Invariant 14. Nothing else enforces the dependency direction.
      - run: cargo xtask check-layers


  # The default build must stay free of C dependencies. `cargo tree` is the
  # check: a `cc` or `cmake` build-dependency appearing here means the
  # toolchain-free promise has quietly been broken.
  no-native-deps:
    name: no C toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - name: Fail if an unexpected native build dependency crept in
        run: |
          set -euo pipefail

          # `cc` reaches the tree through exactly one sanctioned path:
          #   episteme-* -> telemetry -> mcap -> {lz4 -> lz4-sys, zstd -> zstd-sys}
          #
          # MCAP recording is not optional in the telemetry stack, and that
          # stack is mandated by CLAUDE.md rule 41. The carve-out is recorded
          # here rather than the check being deleted, so a *second* native
          # dependency still fails the build.
          #
          # The check works by inversion: everything that pulls in a native
          # builder must already be named below. Anything else is a new path.
          # An earlier version compared against evidence of the *expected*
          # chain, which is permanently present — so its condition never fired
          # and any new native dependency passed green.
          allowed='cc|lz4|lz4-sys|mcap|telemetry|zstd|zstd-safe|zstd-sys|episteme-[a-z]+|xtask'

          status=0
          for pkg in cc cmake bindgen; do
            # Empty output means the package is not in the tree at all.
            tree=$(cargo tree --workspace --edges normal,build --invert "$pkg" \
              --prefix none 2>/dev/null || true)
            [ -n "$tree" ] || continue

            # First field of each line is the package name; `(*)` marks a
            # repeat of a subtree already printed.
            unexpected=$(printf '%s\n' "$tree" \
              | awk 'NF { print $1 }' \
              | sort -u \
              | grep -Ev "^($allowed)$" || true)

            if [ -n "$unexpected" ]; then
              echo "::error::$pkg is reached through an unsanctioned path by:"
              printf '%s\n' "$unexpected"
              echo "--- full inverted tree for $pkg ---"
              printf '%s\n' "$tree"
              status=1
            fi
          done

          if [ "$status" -ne 0 ]; then
            echo "Invariant 1 allows exactly one C-compiled path: the MCAP"
            echo "chain under the telemetry stack. Anything else needs a"
            echo "decision recorded in CLAUDE.md, not an addition to this list."
            exit 1
          fi
          echo "no unexpected native build dependencies"

      # The guard above only means something if it can fail. A dependency that
      # drags in a C toolchain by a new path must break the build, so that is
      # rehearsed here rather than assumed.
      - name: Prove the guard fails on a new native dependency
        run: |
          set -euo pipefail
          cp crates/episteme-core/Cargo.toml /tmp/core-manifest.bak
          # `ring` builds with `cc` and has nothing to do with MCAP.
          printf '\nring = "0.17"\n' >> crates/episteme-core/Cargo.toml

          if cargo tree --workspace --edges normal,build --invert cc --prefix none \
             2>/dev/null | awk 'NF { print $1 }' | sort -u \
             | grep -Eqv '^(cc|lz4|lz4-sys|mcap|telemetry|zstd|zstd-safe|zstd-sys|episteme-[a-z]+|xtask)$'; then
            echo "guard correctly detects a new native path"
          else
            echo "::error::the no-C-toolchain guard did not detect an added cc dependency"
            cp /tmp/core-manifest.bak crates/episteme-core/Cargo.toml
            exit 1
          fi
          cp /tmp/core-manifest.bak crates/episteme-core/Cargo.toml

  toolchain:
    name: toolchain is pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the running compiler matches the pin
        run: |
          pinned=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' rust-toolchain.toml | tr -d '"')
          actual=$(rustc --version | cut -d' ' -f2)
          echo "pinned: $pinned"
          echo "actual: $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::rustup did not honour rust-toolchain.toml"
            exit 1
          fi
      - name: Verify Cargo.toml agrees with the pin
        run: |
          pinned=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' rust-toolchain.toml | tr -d '"')
          declared=$(grep -oE 'rust-version = "[^"]+"' Cargo.toml | cut -d'"' -f2)
          echo "toolchain: $pinned  cargo: $declared"
          [ "$pinned" = "$declared" ] || {
            echo "::error::rust-version in Cargo.toml disagrees with rust-toolchain.toml"
            exit 1
          }

  # Crash-consistency and telemetry-leak suites are slow enough to be worth
  # naming separately, so a failure is legible in the checks list rather than
  # buried in a full run.
  invariants:
    name: crash consistency · telemetry leaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          cache-on-failure: true
      - run: cargo test -p episteme-storage --test crash_consistency
      - run: cargo test -p episteme-storage --test buffer_visibility
      - run: cargo test -p episteme-storage --test segment_roundtrip
      - run: cargo test -p episteme-index  --test telemetry_leaks
      - run: cargo test -p episteme-server --test wiring

  # Recall is the only number that makes an ANN change meaningful. Release mode
  # because a debug-built graph is too slow to measure at a useful size.
  recall:
    name: hnsw recall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          # Release artifacts live in a different directory from debug ones, so
          # sharing a key with the debug jobs would store both and hit neither.
          shared-key: release
          cache-on-failure: true
      - run: cargo test -p episteme-index --test hnsw_recall --release -- --nocapture
      - run: cargo test -p episteme-index --test hnsw_distribution --release -- --nocapture
      - run: cargo test -p episteme-index --test hnsw_persist --release
      # The batched builder has its own recall floor per batch size. It was
      # absent from this gate while the first batch of every build was being
      # orphaned wholesale, so nothing here noticed recall at 0.57.
      - run: cargo test -p episteme-index --test hnsw_parallel --release -- --nocapture
      - run: cargo test -p episteme-storage --test codec_recall --release -- --nocapture
      - run: cargo test -p episteme-storage --test two_tier_recall --release -- --nocapture
      - name: Recall gate at 128 dimensions
        run: cargo run --release -p episteme-index --bin recall -- --rows 20000 --dim 128 --ef 64
