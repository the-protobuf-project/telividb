version: 2

updates:
  # ---------------------------------------------------------------------------
  # Rust dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      prefix-development: "deps(dev)"
      include: scope
    labels: ["dependencies", "rust"]

    # Grouped so a quiet week is one PR rather than nine. Patch and minor
    # updates travel together because they are reviewed the same way; majors
    # arrive alone, since each needs its own read.
    groups:
      rust-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

    ignore:
      # The toolchain is pinned deliberately (rust-toolchain.toml). A compiler
      # upgrade is a reviewed commit, never a dependency bump.
      - dependency-name: "rust"

  # ---------------------------------------------------------------------------
  # The desktop app, which is its own cargo workspace
  # ---------------------------------------------------------------------------
  #
  # Listed separately because `directory: "/"` above resolves the repository
  # workspace only, and `app/` is deliberately excluded from it (see
  # `app/Cargo.toml`). Without this entry the app's dependencies never receive
  # an update PR at all — security alerts still arrive, because the advisory
  # scan reads every lockfile regardless of this file, but nothing would ever
  # act on them. That asymmetry is how a GUI-stack advisory became a filed
  # alert rather than a merged bump.
  - package-ecosystem: cargo
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(app)"
      include: scope
    labels: ["dependencies", "rust", "desktop"]
    groups:
      app-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]

    ignore:
      - dependency-name: "rust"
      # Tauri's Linux backend pins the gtk3 bindings, which are closed at 0.18
      # and will never carry the fix for RUSTSEC-2024-0429. A PR moving them is
      # not possible, and the reasoning is recorded in `app/deny.toml` rather
      # than rediscovered each week.
      - dependency-name: "glib"
        versions: ["0.18.x"]

  # ---------------------------------------------------------------------------
  # GitHub Actions used by CI
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]
    groups:
      actions:
        patterns: ["*"]

    ignore:
      # Its refs are Rust releases, not action versions.
      #
      # `dtolnay/rust-toolchain@1.98.0` installs Rust 1.98.0; there is no
      # semantic-versioning relationship between one ref and the next, and
      # "newer" is not "better" — it is a different compiler. Dependabot
      # bumped it to `@1.100.0`, which does not exist, and auto-merge landed
      # that on main.
      #
      # The toolchain is pinned in `rust-toolchain.toml` and a compiler
      # upgrade is a reviewed commit, never a dependency bump — the same rule
      # the cargo section above applies to `rust`. No workflow should name a
      # Rust version at all now, so this is a guard against one creeping back.
      - dependency-name: "dtolnay/rust-toolchain"
