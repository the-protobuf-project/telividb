[package]
name = "telividb-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telividb-core.workspace = true
telividb-embed.workspace = true
telividb-index.workspace = true
telividb-proto.workspace = true
telividb-storage.workspace = true
telividb-telemetry.workspace = true

tonic = { version = "0.14", features = ["router"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
# Browsers cannot speak native gRPC: HTTP/2 trailers are unreachable from
# `fetch`. The embedded UI therefore needs gRPC-web, and layering it now avoids
# reworking streaming semantics later.
tonic-web = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
thiserror.workspace = true
# `google.protobuf.Duration`, for converting a wire `Span`'s offsets to and
# from milliseconds. Pinned to the same version telividb-proto builds
# against, so there is exactly one `prost-types` in the dependency graph.
prost-types = "0.14"
# Structured data on a log record is a JSON value, keyed by the `fields::`
# constants — which a serde derive could not name.
serde_json = "1"
tokio-stream = { version = "0.1", features = ["net"] }

[features]
# GPU-accelerated search, on by default and forwarded to the index crate.
#
# The server carries its own flag rather than reading the index crate's
# because a `#[cfg]` only sees features of the crate it is compiled in — so
# without this, the startup device announcement could not tell whether the
# GPU path was even built.
default = ["gpu"]
gpu = ["telividb-index/gpu"]
# CUDA needs the SDK at build time, so it stays opt-in. See the index crate.
cuda = ["gpu", "telividb-index/cuda"]

[dev-dependencies]
bytes = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
