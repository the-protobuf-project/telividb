[package]
name = "telividb-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telividb-core.workspace = true
telividb-distance.workspace = true
telividb-telemetry.workspace = true
# The pipeline itself, not a facade in front of it — CLAUDE.md rule 41.
# Emission is a no-op until a composition root installs it, so this crate stays
# synchronous, benchable and embeddable.
telemetry.workspace = true
# Structured data on a log record is a JSON value, and its keys are the
# `fields::` constants — which a serde derive could not name, since
# `#[serde(rename)]` takes a literal and these are consts.
serde_json = "1"
crc32fast = "1.4"
# IEEE 754-2008 binary16. Pure Rust, no build script — hand-rolling the
# subnormal and rounding cases is a known source of subtle, silent errors.
half = { version = "2", default-features = false, features = ["std"] }
thiserror.workspace = true
# Small mutable metadata — today, the graph's persisted edges. Pure Rust,
# ACID, no C dependency (CLAUDE.md invariant 1).
redb.workspace = true

[dev-dependencies]
tempfile = "3"
telividb-index.workspace = true
telividb-graph.workspace = true
