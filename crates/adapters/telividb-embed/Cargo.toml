[package]
name = "telividb-embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telividb-core.workspace = true
telividb-telemetry.workspace = true
telemetry.workspace = true
thiserror.workspace = true
serde_json = "1"

# The only tensor runtime in this project (rule 42). Note what is *not* here:
# `candle-nn` and `candle-transformers`. Everything the encoder needs —
# `QTensor`, `QMatMul`, `gguf_file`, and the tensor ops that layer norm, GELU
# and softmax are built from — lives in `candle-core` alone, so neither of the
# larger crates (and neither one's model zoo) enters the build.
candle-core.workspace = true

# WordPiece tokenization, built from the vocabulary the GGUF already carries.
#
# `default-features = false` is load-bearing, not tidiness. The defaults are
# `progressbar`, `onig` and `esaxx_fast`; the last enables `esaxx-rs/cpp`,
# which is C++ and would be a *third* native carve-out against rule 1. candle
# already pulls this crate with `onig` alone (rule 1's second carve-out), and
# because Cargo unions features, asking for nothing here keeps the union at
# exactly what it is today rather than widening it.
tokenizers = { version = "0.22", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }

[features]
default = []
# Dispatch inference to CUDA. Requires the CUDA SDK at build time, which is
# why it is opt-in — see rule 46 and the note in `.github/workflows/ci.yml`.
cuda = ["candle-core/cuda"]

[dev-dependencies]
tempfile = "3"
