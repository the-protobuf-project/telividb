[package]
name = "telividb-embed"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telividb-core.workspace = true
telividb-telemetry.workspace = true
telemetry.workspace = true
thiserror.workspace = true
serde_json = "1"

# The only tensor runtime in this project (rule 42). Note what is *not* here:
# `candle-nn` and `candle-transformers`. Everything the encoder needs —
# `QTensor`, `QMatMul`, `gguf_file`, and the tensor ops that layer norm, GELU
# and softmax are built from — lives in `candle-core` alone, so neither of the
# larger crates (and neither one's model zoo) enters the build.
# Layer one. The ggml encoder is built against this; candle is on its way out.
telividb-compute = { path = "../../platform/telividb-compute" }

# WordPiece tokenization, built from the vocabulary the GGUF already carries.
# **`fancy-regex`, not `onig`.** `tokenizers` requires one regex engine or the
# other. `onig` is Oniguruma, which is C and builds with `cc`; `fancy-regex` is
# pure Rust. While candle was in the tree its `tokenizers` dependency pulled
# `onig` and there was nothing to be gained by objecting — the union of Cargo
# features made the choice elsewhere. Removing candle put that choice back in
# reach, so this crate now contributes **no native dependency at all**, which
# is one fewer carve-out against rule 1 than the workspace carried yesterday.
#
# `esaxx_fast` stays off: it enables `esaxx-rs/cpp`, which is C++, and it is
# only used for Unigram training — something a loader never does.
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[features]
default = []
# Dispatch inference to CUDA. Requires the CUDA SDK at build time, which is
# why it is opt-in — see rule 46 and the note in `.github/workflows/ci.yml`.
cuda = ["telividb-compute/cuda"]
# Dispatch inference to AMD, Intel or any Vulkan device. Each needs its own SDK
# at build time, which is why none is default.
hip = ["telividb-compute/hip"]
sycl = ["telividb-compute/sycl"]
vulkan = ["telividb-compute/vulkan"]

[dev-dependencies]
tempfile = "3"
