# ── Entries below were found through llmfit's model database ────────────────
#
# https://github.com/AlexsJones/llmfit (MIT) ships a scraped index of some
# thirteen thousand models. Filtered to `format = gguf`, `pipeline_tag =
# feature-extraction` and an architecture `telividb-core` can load, it yields 27
# rows — most of them re-uploads of models already listed above. So it is a
# discovery source, not a replacement for this file: it says a model *exists*,
# and everything trustworthy below still came from the file itself.
#
# The crate was evaluated and not taken. `llmfit-core` has no feature flags and
# depends unconditionally on `ureq`, which reaches `ring` — a native dependency
# rule 1 does not sanction in this workspace, added for what is a JSON file. The
# data is MIT; the dependency was the part not worth it.
#
# Each entry was resolved the way the header above prescribes: `digest` and
# `size_bytes` are HuggingFace's `lfs.oid` and `lfs.size`, and `architecture`,
# `dimensions` and `context_length` were read from the GGUF header over a range
# request. All eight agreed with what llmfit claimed — which is a reason to keep
# checking, not a reason to stop.

