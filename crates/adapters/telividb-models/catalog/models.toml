# The curated model catalog.
#
# Every entry here has been verified against the file it names: `architecture`,
# `dimensions`, `context_length` and `pooling` are read out of the GGUF header,
# not copied from a model card, and `digest` is the file's SHA-256.
#
# Curated rather than searched, for a reason that is checkable: the encoder
# supports exactly the architectures in `telividb-embed`'s `config::SUPPORTED`
# — `bert` and `nomic-bert`. HuggingFace hosts tens of thousands of GGUFs and
# almost all of them are chat models this loader cannot read, so a search box
# over it would mostly offer files that fail at load. HuggingFace is the file
# host here; the curation is ours.
#
# Adding an entry, until the downloader lands and this can be a command:
#
#   1. GET https://huggingface.co/api/models/<repo>/tree/main and take the
#      file's `lfs.oid` as `digest` and `lfs.size` as `size_bytes`. Both are
#      exact; a rounded size makes a progress bar that ends in the wrong place.
#   2. Range-request the first 2 MB of the file and read `general.architecture`
#      and `<arch>.embedding_length` from the GGUF header. Never take these
#      from the model card — the card describes the weights, not the specific
#      quantization published here.
#   3. If the architecture is not one `telividb-core`'s `Architecture` lists,
#      stop. The entry cannot be added, because the file cannot be loaded.
#
# Never hand-write a digest. A wrong one fails at install with a mismatch,
# which is safe but presents as a network fault rather than as the typo it is.

