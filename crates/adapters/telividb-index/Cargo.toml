[package]
name = "telividb-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telividb-core.workspace = true
telividb-distance.workspace = true
telividb-telemetry.workspace = true
# The pipeline itself, not a facade in front of it — CLAUDE.md rule 41.
# Emission is a no-op until a composition root installs it, so this crate stays
# synchronous, benchable and embeddable.
telemetry.workspace = true
# Structured data on a log record is a JSON value, and its keys are the
# `fields::` constants — which a serde derive could not name, since
# `#[serde(rename)]` takes a literal and these are consts.
serde_json = "1"
rayon = { version = "1.10", optional = true }

# The tensor runtime, layer one. Which hardware backends it carries is decided
# there — Metal is automatic on macOS, CUDA and the rest are its own features —
# so this crate names no accelerator and needs no target section of its own.
telividb-compute = { path = "../../platform/telividb-compute", optional = true }

[features]
default = ["parallel", "gpu"]
# Parallel graph construction. See adapters::hnsw::build for the determinism
# guarantee it preserves and the one it does not.
parallel = ["dep:rayon"]
# Device-resident exhaustive search: the corpus as one matrix, scored with a
# single matmul on whatever hardware `telividb-compute` reaches.
#
# **On by default, with an automatic CPU fallback.** `Device::best` tries the
# accelerators in turn and ends at CPU, so this is safe to ship enabled: a
# machine with no GPU gets identical results, only slower. The cost is that
# `telividb-compute` builds ggml, which needs a native toolchain — which is why
# `--no-default-features --features parallel` remains a supported way to build
# without it.
gpu = ["dep:telividb-compute"]
# Dispatch to CUDA. Requires the CUDA SDK at build time.
cuda = ["gpu", "telividb-compute/cuda"]
# Dispatch to AMD (HIP/ROCm), Intel (SYCL) or any Vulkan device. Each needs its
# own SDK at build time, which is why none is default.
hip = ["gpu", "telividb-compute/hip"]
sycl = ["gpu", "telividb-compute/sycl"]
vulkan = ["gpu", "telividb-compute/vulkan"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
# MCAP message payloads are zstd-compressed, so a substring search over the
# raw file only ever sees schema metadata. Reading the recording properly is
# what stops the leak assertions passing vacuously.
mcap = "0.25"
