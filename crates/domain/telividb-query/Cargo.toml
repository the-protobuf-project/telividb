[package]
name = "telividb-query"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
telividb-core.workspace = true
telividb-graph.workspace = true
telividb-telemetry.workspace = true
# The pipeline itself, not a facade — CLAUDE.md rule 41.
telemetry.workspace = true
serde_json = "1"

# Note what is absent: `telividb-index`. This crate composes *results*, not
# indexes. A caller runs its own vector search and hands the hits in, which is
# what keeps a query planner in `domain/` — able to depend on nothing outward,
# and testable with no index, no storage and no device.
