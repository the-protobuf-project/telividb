[package]
name = "telividb-graph"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
telividb-core.workspace = true
telividb-telemetry.workspace = true
# The pipeline itself, not a facade — CLAUDE.md rule 41. Emission is a no-op
# until a composition root installs it, so this crate stays synchronous and
# embeddable.
telemetry.workspace = true
# Structured data on a log record is a JSON value, keyed by the `fields::`
# constants — which a serde derive could not name.
serde_json = "1"
petgraph.workspace = true
