[package]
name = "telividb-buffers"
version.workspace = true
edition.workspace = true
# Apache-2.0, not AGPL, for the same reason telividb-proto is: a proprietary
# client that merely speaks the wire format must not need a commercial licence.
# The line is drawn at linking the engine, not at parsing its messages.
license = "Apache-2.0"

# No build script. Everything in `src/generated/` is produced by `buf` and
# `buffers` and committed, so `cargo build` needs no protobuf toolchain, no
# `capnp` and no `flatc` — the same rule that keeps C compilers out of the
# default build.

[lib]
# No doctests. There is no hand-written code here to document, and what
# rustdoc would otherwise collect is not code at all: tonic renders a
# multi-paragraph proto comment as an indented `/** */` block, and Markdown
# reads a four-space indent as a code block. The prose then fails to parse as
# Rust — an em dash is not a token — so a comment written for a reader becomes
# a compile error.
#
# Turning them off is the honest fix rather than reformatting the protos to
# suit a generator's whitespace, or dropping the paragraphs that make the
# comments worth reading.
doctest = false

[features]
default = ["protobuf", "capnp"]

# Protobuf, via prost and tonic. On by default because it is the wire protocol
# the server actually speaks; a consumer that only wants a flat view can turn it
# off and skip the tonic dependency tree entirely.
protobuf = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:bytes"]

# Cap'n Proto. Validates as it reads, so the generated code contains no
# `unsafe` and the crate keeps `forbid(unsafe_code)`.
capnp = ["dep:capnp"]

# Model Context Protocol servers, one per service. Not default, for the same
# reason FlatBuffers is not: it pulls a server runtime — `rmcp`, async-trait,
# serde_json — into a crate whose whole claim is that it is the wire format and
# nothing else. A plugin author who wants the schema should not have to take an
# MCP runtime with it.
#
# The composition root that actually serves MCP turns this on.
mcp = ["dep:rmcp", "dep:async-trait", "dep:serde_json", "dep:axum", "dep:tokio"]

# FlatBuffers. Deliberately NOT default: its accessors are `unsafe` by
# construction, and admitting 1066 unsafe blocks to the default build would
# widen the workspace's unsafe surface for a path nothing wires yet.
flatbuffers = ["dep:flatbuffers"]

[dependencies]
tonic = { version = "0.14", features = ["router", "codegen"], optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
bytes = { version = "1", optional = true }
capnp = { version = "0.27", optional = true }
flatbuffers = { version = "25", optional = true }
rmcp = { version = "3.1", features = ["server", "elicitation", "transport-io", "transport-streamable-http-server"], optional = true }
async-trait = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }
# The generated servers mount their streamable-HTTP transport on an axum
# router and await it on tokio. Both arrive only with the `mcp` feature —
# nothing in the default build pulls a web server or a runtime.
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["net", "rt", "macros"], optional = true }
