[package]
name = "episteme-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Facades only. These compile to near-nothing when no subscriber or recorder is
# installed, so a library crate pays nothing for being instrumented.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
metrics = "0.24"
thiserror.workspace = true

# The ecosystem's telemetry stack: structured logging, OpenTelemetry traces and
# metrics, and MCAP recording behind one builder.
#
# Pinned to a tag rather than a branch, so a push upstream cannot change this
# build. Behind the `subscriber` feature because it brings an async runtime and
# OTLP exporters — neither of which belongs in a library.
telemetry = { git = "https://github.com/the-protobuf-project/telemetry", tag = "v1.1.0", optional = true }

[features]
default = []
# Installs the real pipeline. Composition roots only.
subscriber = ["dep:telemetry"]

[dev-dependencies]
episteme-core.workspace = true
