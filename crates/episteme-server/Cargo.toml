[package]
name = "episteme-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
episteme-core.workspace = true
episteme-index.workspace = true
episteme-proto.workspace = true
episteme-storage.workspace = true
episteme-telemetry = { workspace = true, features = ["subscriber"] }

tonic = { version = "0.14", features = ["router"] }
tonic-health = "0.14"
tonic-reflection = "0.14"
# Browsers cannot speak native gRPC: HTTP/2 trailers are unreachable from
# `fetch`. The embedded UI therefore needs gRPC-web, and layering it now avoids
# reworking streaming semantics later.
tonic-web = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tracing = "0.1"
thiserror.workspace = true

[dev-dependencies]
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
