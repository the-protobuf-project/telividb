// The context assembly service.
syntax = "proto3";

package telividb.context.v1;

import "buffers/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "telividb/context/v1/context_template.proto";

option java_multiple_files = true;
option java_outer_classname = "ContextServiceProto";
option java_package = "dev.telividb.context.v1";
option (buffers.v1.file) = {namespace: "telividb.context.v1"};

// Manages context templates and assembles retrieval context from them.
//
// Named for the resource it manages rather than for the operation, which is
// both what AIP-121 asks and what avoids a real collision: a service called
// `Context` generates a trait called `Context`, and that shadows
// `std::task::Context` inside the generated service code.
//
// The boundary is deliberate: this returns ranked, deduplicated,
// budget-fitted fragments with provenance. It does not render a prompt and does
// not call a generative model. The moment the engine templates prompts it is
// coupled to one model's chat format, and the database would need re-releasing
// every time a template changed.
service ContextTemplates {
  option (google.api.default_host) = "telividb.dev";

  // Creates a context template.
  rpc CreateContextTemplate(CreateContextTemplateRequest) returns (ContextTemplate) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/contextTemplates"
      body: "context_template"
    };
    option (google.api.method_signature) = "parent,context_template,context_template_id";
  }

  // Retrieves a single context template.
  rpc GetContextTemplate(GetContextTemplateRequest) returns (ContextTemplate) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/contextTemplates/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists context templates.
  rpc ListContextTemplates(ListContextTemplatesRequest) returns (ListContextTemplatesResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/contextTemplates"};
    option (google.api.method_signature) = "parent";
  }

  // Soft-deletes a context template.
  rpc DeleteContextTemplate(DeleteContextTemplateRequest) returns (ContextTemplate) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/contextTemplates/*}"};
    option (google.api.method_signature) = "name";
  }

  // Searches, expands along the graph, deduplicates, ranks and fits a budget.
  //
  // Unary rather than streaming. Streaming would change the ranking contract:
  // you cannot re-rank what has already been sent, and the whole value here is
  // that the ordering accounts for everything retrieved.
  rpc AssembleContext(AssembleContextRequest) returns (AssembleContextResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/context:assemble"
      body: "*"
    };
  }
}

// Request message for creating a context template.
message CreateContextTemplateRequest {
  // Organization the template belongs to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/ContextTemplate"}
  ];

  // Identifier to use, forming the final path segment.
  string context_template_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The template to create.
  ContextTemplate context_template = 3 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier making this request safe to retry.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for retrieving a context template.
message GetContextTemplateRequest {
  // Resource name of the template.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/ContextTemplate"}
  ];
}

// Request message for listing context templates.
message ListContextTemplatesRequest {
  // Organization to list templates from.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/ContextTemplate"}
  ];

  // Maximum number to return. Zero selects a server-chosen default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression restricting which templates are returned.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing context templates.
message ListContextTemplatesResponse {
  // The templates on this page.
  repeated ContextTemplate context_templates = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Token to retrieve the next page, or empty if this is the last.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for deleting a context template.
message DeleteContextTemplateRequest {
  // Resource name of the template to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/ContextTemplate"}
  ];

  // Current etag, to refuse a delete racing a concurrent change.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for assembling context.
message AssembleContextRequest {
  // Organization to retrieve from.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/ContextTemplate"}
  ];

  // What to retrieve for.
  string query = 2 [(google.api.field_behavior) = REQUIRED];

  // Restrict retrieval to these spaces. Empty searches everything visible.
  repeated string spaces = 3 [(google.api.field_behavior) = OPTIONAL];

  // A saved template supplying expansion and budget.
  string context_template = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "telividb.dev/ContextTemplate"}
  ];

  // Expansion settings, overriding the template.
  Expansion expansion = 5 [(google.api.field_behavior) = OPTIONAL];

  // Budget, overriding the template.
  Budget budget = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for assembling context.
message AssembleContextResponse {
  // The fragments, highest score first.
  repeated Fragment fragments = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether every source could be consulted.
  bool complete = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Spaces skipped because they are locked. Names only, never contents.
  repeated string locked_spaces = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Whether a suppressed region borders these results.
  //
  // Machine-visible and human-invisible. A caller that reasons over this can
  // decline to pursue the topic; the rendered answer must never say that a
  // suppressed memory exists, because delivering that reminder is the harm
  // suppression was asked for.
  bool suppressed_region_adjacent = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
