// The policy service.
syntax = "proto3";

package telividb.policy.v1;

import "buffers/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "mcp/protobuf/annotations.proto";
import "telividb/policy/v1/policy_set.proto";

option go_package = "github.com/the-protobuf-project/telividb/gen/go/telividb/policy/v1;policyv1";
option java_multiple_files = true;
option java_outer_classname = "PolicyServiceProto";
option java_package = "dev.telividb.policy.v1";
option (buffers.v1.file) = {namespace: "telividb.policy.v1"};

// Manages policy sets and answers what a principal would be able to see.
//
// One predicate covers every access path. A row reached by graph traversal is
// checked against the same predicate as a row reached by nearest-neighbour
// search — writing a second authorization path for the graph is how two
// systems that must agree drift apart and leak.
service Policy {
  option (google.api.default_host) = "telividb.dev";
  option (mcp.service) = {
    app: {
      name: "telividb policy"
      version: "0.1.0"
      description: "Policy sets, and what a principal would be permitted to see."
    }
  };

  // Creates a policy set.
  rpc CreatePolicySet(CreatePolicySetRequest) returns (PolicySet) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/policySets"
      body: "policy_set"
    };
    option (google.api.method_signature) = "parent,policy_set,policy_set_id";
  }

  // Retrieves a single policy set.
  rpc GetPolicySet(GetPolicySetRequest) returns (PolicySet) {
    option (google.api.http) = {get: "/v1/{name=organizations/*/policySets/*}"};
    option (google.api.method_signature) = "name";
  }

  // Lists policy sets.
  rpc ListPolicySets(ListPolicySetsRequest) returns (ListPolicySetsResponse) {
    option (google.api.http) = {get: "/v1/{parent=organizations/*}/policySets"};
    option (google.api.method_signature) = "parent";
  }

  // Soft-deletes a policy set.
  //
  // Removing a policy set does not widen access: absent policy denies, so a
  // deleted set fails closed rather than opening what it used to restrict.
  rpc DeletePolicySet(DeletePolicySetRequest) returns (PolicySet) {
    option (google.api.http) = {delete: "/v1/{name=organizations/*/policySets/*}"};
    option (google.api.method_signature) = "name";
    option (mcp.elicitation) = {message: "This tombstones the policy set. Absent policy denies, so access narrows rather than widens. Confirm?"};
  }

  // Evaluates policy without applying it, returning the resulting decision.
  //
  // The debugging tool for "why did this return nothing". Without it the
  // difference between an empty collection and an effective denial is
  // invisible, and a predicate that silently matches nothing looks exactly
  // like data that is not there.
  rpc EvaluatePolicy(EvaluatePolicyRequest) returns (EvaluatePolicyResponse) {
    option (google.api.http) = {
      post: "/v1/{parent=organizations/*}/policySets:evaluate"
      body: "*"
    };
  }
}

// Request message for creating a policy set.
message CreatePolicySetRequest {
  // Organization the policy set belongs to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/PolicySet"}
  ];

  // Identifier to use, forming the final path segment.
  string policy_set_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The policy set to create.
  PolicySet policy_set = 3 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier making this request safe to retry.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for retrieving a policy set.
message GetPolicySetRequest {
  // Resource name of the policy set.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/PolicySet"}
  ];
}

// Request message for listing policy sets.
message ListPolicySetsRequest {
  // Organization to list policy sets from.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/PolicySet"}
  ];

  // Maximum number to return. Zero selects a server-chosen default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression restricting which policy sets are returned.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // Whether to include soft-deleted policy sets.
  bool show_deleted = 5 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing policy sets.
message ListPolicySetsResponse {
  // The policy sets on this page.
  repeated PolicySet policy_sets = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Token to retrieve the next page, or empty if this is the last.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for deleting a policy set.
message DeletePolicySetRequest {
  // Resource name of the policy set to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/PolicySet"}
  ];

  // Current etag, to refuse a delete racing a concurrent change.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for evaluating policy without applying it.
message EvaluatePolicyRequest {
  // Organization the evaluation runs in.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/PolicySet"}
  ];

  // The principal to evaluate for.
  string principal = 2 [(google.api.field_behavior) = REQUIRED];

  // The resource the principal is trying to reach.
  string resource = 3 [(google.api.field_behavior) = REQUIRED];

  // The operation being attempted, such as `read` or `read_vector`.
  string operation = 4 [(google.api.field_behavior) = REQUIRED];
}

// Response message for evaluating policy.
message EvaluatePolicyResponse {
  // What the principal would be permitted to see.
  Decision decision = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}
