// The Conversation resource.
syntax = "proto3";

package telividb.conversation.v1;

import "buffers/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/the-protobuf-project/telividb/gen/go/telividb/conversation/v1;conversationv1";
option java_multiple_files = true;
option java_outer_classname = "ConversationProto";
option java_package = "dev.telividb.conversation.v1";
option (buffers.v1.file) = {namespace: "telividb.conversation.v1"};

// An exchange of messages, and the unit that moves between spaces.
//
// Named under its organization and nothing else. Session, space and project
// are fields rather than path segments because a conversation moves between
// them, and a move that renamed the resource would break every stored edge
// endpoint, every archived reference and every citation in an assembled
// answer — external names are the only portable identity there is.
message Conversation {
  option (google.api.resource) = {
    type: "telividb.dev/Conversation"
    pattern: "organizations/{organization}/conversations/{conversation}"
    singular: "conversation"
    plural: "conversations"
  };

  // Resource name of the conversation.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-readable name.
  string display_name = 2 [(google.api.field_behavior) = OPTIONAL];

  // Session this conversation was recorded in.
  string session = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "telividb.dev/Session"}
  ];

  // The message currently at the end of the active branch.
  //
  // Messages form a directed acyclic graph rather than a chain: regenerating a
  // reply or editing and resubmitting creates a sibling, so a message may have
  // several children. This names which leaf the default retrieval path ends
  // at; other branches remain reachable but are not followed by default.
  string head = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {type: "telividb.dev/Message"}
  ];

  // Whether this conversation is excluded from ordinary recall.
  //
  // Suppression retains the content and leaves it reachable to its owner
  // deliberately, while stopping traversal and keeping it out of assembled
  // context. It is a recall preference over the owner's own memory, never an
  // access-control mechanism — a principal denied by policy is denied whether
  // this is set or not.
  bool suppressed = 5 [(google.api.field_behavior) = OPTIONAL];

  // Messages on the active branch.
  int32 message_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the conversation was created.
  google.protobuf.Timestamp create_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the conversation was last modified.
  google.protobuf.Timestamp update_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the conversation was soft-deleted, or unset while it is live.
  google.protobuf.Timestamp delete_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted conversation is purged and becomes unrecoverable.
  google.protobuf.Timestamp expire_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque value for optimistic concurrency on update.
  string etag = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}
