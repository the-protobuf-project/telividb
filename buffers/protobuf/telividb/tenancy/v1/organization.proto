// The Organization resource — the root of the tenancy tree.
syntax = "proto3";

package telividb.tenancy.v1;

import "buffers/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/the-protobuf-project/telividb/gen/go/telividb/tenancy/v1;tenancyv1";
option java_multiple_files = true;
option java_outer_classname = "OrganizationProto";
option java_package = "dev.telividb.tenancy.v1";
option (buffers.v1.file) = {namespace: "telividb.tenancy.v1"};

// The top of the tenancy tree, and the only container that never changes for
// anything beneath it.
//
// That permanence is why it is the one container that appears in a resource
// name: a conversation moves freely between projects and spaces, so encoding
// those in its name would make every move a rename and break every stored
// reference to it. Moving between organizations is an export, not a move.
//
// An organization is also the physical boundary. One organization is one
// collection, so purging a tenant never rewrites another tenant's segments.
message Organization {
  option (google.api.resource) = {
    type: "telividb.dev/Organization"
    pattern: "organizations/{organization}"
    singular: "organization"
    plural: "organizations"
  };

  // Resource name of the organization.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Human-readable name.
  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Projects belonging to this organization.
  int32 project_count = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Spaces belonging to this organization.
  int32 space_count = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the organization was created.
  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the organization was last modified.
  google.protobuf.Timestamp update_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When the organization was soft-deleted, or unset while it is live.
  //
  // Deletion is reversible until `expire_time`. Nothing is physically removed
  // at delete: the tenant is tombstoned so queries exclude it immediately, and
  // compaction reclaims the bytes later.
  google.protobuf.Timestamp delete_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];

  // When a soft-deleted organization is purged and becomes unrecoverable.
  google.protobuf.Timestamp expire_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Opaque value for optimistic concurrency on update.
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
}
