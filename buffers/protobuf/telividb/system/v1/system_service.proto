// The system service.
syntax = "proto3";

package telividb.system.v1;

import "buffers/v1/annotations.proto";
import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "telividb/system/v1/system.proto";

option java_multiple_files = true;
option java_outer_classname = "SystemServiceProto";
option java_package = "dev.telividb.system.v1";
option (buffers.v1.file) = {namespace: "telividb.system.v1"};

// Reports what only this process can know about itself.
//
// Telemetry here emits shape, never values — `dimensions=768`, never the
// components. A vector in a log is readable by anyone with log access and can
// be inverted back toward its source text.
service SystemInfo {
  option (google.api.default_host) = "telividb.dev";

  // Retrieves the selected backend, the device, and the memory budget.
  rpc GetSystem(GetSystemRequest) returns (System) {
    option (google.api.http) = {get: "/v1/{name=system}"};
    option (google.api.method_signature) = "name";
  }
}

// Request message for retrieving the system singleton.
message GetSystemRequest {
  // Resource name of the singleton. Always `system`.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/System"}
  ];
}
