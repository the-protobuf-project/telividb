// Request and response messages for the graph services.
syntax = "proto3";

package telividb.graph.v1;

import "buffers/v1/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "telividb/graph/v1/edge.proto";

option java_multiple_files = true;
option java_outer_classname = "GraphMessagesProto";
option java_package = "dev.telividb.graph.v1";
option (buffers.v1.file) = {namespace: "telividb.graph.v1"};

// Request message for creating an edge.
message CreateEdgeRequest {
  // Organization the edge belongs to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/Edge"}
  ];

  // Identifier to use, forming the final path segment.
  string edge_id = 2 [(google.api.field_behavior) = OPTIONAL];

  // The edge to create.
  Edge edge = 3 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier making this request safe to retry.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for retrieving an edge.
message GetEdgeRequest {
  // Resource name of the edge.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/Edge"}
  ];
}

// Request message for listing edges.
message ListEdgesRequest {
  // Organization to list edges from.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/Edge"}
  ];

  // Maximum number to return. Zero selects a server-chosen default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression, such as `source = "..." AND edge_type = "..."`.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];

  // How to order the results.
  string order_by = 5 [(google.api.field_behavior) = OPTIONAL];

  // Whether to include soft-deleted edges.
  bool show_deleted = 6 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing edges.
message ListEdgesResponse {
  // The edges on this page.
  repeated Edge edges = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Token to retrieve the next page, or empty if this is the last.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for creating several edges at once.
//
// Edges import in a second pass, after the resources they join exist. A batch
// is how that pass is expressed, and one dangling edge follows the configured
// policy rather than silently disappearing.
message BatchCreateEdgesRequest {
  // Organization the edges belong to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/Edge"}
  ];

  // The individual create requests.
  repeated CreateEdgeRequest requests = 2 [(google.api.field_behavior) = REQUIRED];
}

// Response message for creating several edges at once.
message BatchCreateEdgesResponse {
  // The edges that were created.
  repeated Edge edges = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for deleting an edge.
message DeleteEdgeRequest {
  // Resource name of the edge to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/Edge"}
  ];

  // Current etag, to refuse a delete racing a concurrent change.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

// Request message for creating an edge type.
message CreateEdgeTypeRequest {
  // Organization the edge type belongs to.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/EdgeType"}
  ];

  // Identifier to use, forming the final path segment.
  string edge_type_id = 2 [(google.api.field_behavior) = REQUIRED];

  // The edge type to create.
  EdgeType edge_type = 3 [(google.api.field_behavior) = REQUIRED];

  // Unique identifier making this request safe to retry.
  string request_id = 4 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
}

// Request message for retrieving an edge type.
message GetEdgeTypeRequest {
  // Resource name of the edge type.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/EdgeType"}
  ];
}

// Request message for listing edge types.
message ListEdgeTypesRequest {
  // Organization to list edge types from.
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "telividb.dev/EdgeType"}
  ];

  // Maximum number to return. Zero selects a server-chosen default.
  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];

  // Page token from a previous call.
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];

  // Filter expression restricting which edge types are returned.
  string filter = 4 [(google.api.field_behavior) = OPTIONAL];
}

// Response message for listing edge types.
message ListEdgeTypesResponse {
  // The edge types on this page.
  repeated EdgeType edge_types = 1 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Token to retrieve the next page, or empty if this is the last.
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Request message for deleting an edge type.
message DeleteEdgeTypeRequest {
  // Resource name of the edge type to delete.
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "telividb.dev/EdgeType"}
  ];

  // Current etag, to refuse a delete racing a concurrent change.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];

  // Whether to delete the type even though edges still reference it.
  bool force = 3 [(google.api.field_behavior) = OPTIONAL];
}
