# Telemetry configuration, auto-discovered by `Telemetry::new()`.
#
# The stack ranks configuration lowest-to-highest as: defaults, this file,
# `TELEMETRY_*` environment variables, then builder calls in code. So anything
# the server sets from a flag wins over this file, and anything it leaves unset
# is decided here.
#
# Discovery is relative to the process working directory, or wherever
# `TELEMETRY_CONFIG_PATH` points. A deployed binary should set that variable
# rather than assume its CWD.

[service]
name = "telividb"
description = "Multimodal vector and graph database"
# No `version` key. It would duplicate the workspace version and drift silently
# at the next bump; the server passes its own `CARGO_PKG_VERSION` instead, which
# outranks this file anyway.
#
# No `environment` key either — `--environment` always sets it, so a value here
# could never take effect.

# Verbosity. This is the setting to reach for, and the reason this file is
# load-bearing rather than decorative: the server only sets a level when
# `--log-level` is passed, so with no flag the value here decides.
#
#   1 = error   2 = info   3 = debug
#
# **Debug by default, deliberately.** At level 1 every `logger::info!` and
# `logger::debug!` in the workspace is dropped before it reaches a sink, so a
# server that is instrumented throughout looks completely silent — which is
# indistinguishable from one that emits nothing at all. Development wants to
# see the whole pipeline: which device an index landed on, every segment seal,
# every RPC, every store open.
#
# A deployment that wants less turns it down here, or per module below, or
# passes `--log-level info`. Nothing about the default makes the quiet path
# unavailable — it makes the loud path the one you get without asking.
[logging]
level = 3

[telemetry.otlp]
endpoint = "localhost:6009"   # Port 6009 auto-added

# Per-module overrides, which exist only here — there is no flag for them.
# Raise one crate to debug without drowning in the rest.
#
# [logging.modules.telividb-storage]
# level = 3
