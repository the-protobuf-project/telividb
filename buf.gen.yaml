version: v2

# Generated Rust is **committed**, not produced at build time.
#
# Three reasons it is worth the extra step:
#
#   - `cargo build` needs no protobuf toolchain at all. A contributor clones and
#     builds with rustup and nothing else, which is the same rule that keeps C
#     compilers out of the default build.
#   - Generated code is reviewable. A field renumbered or a service renamed
#     shows up in the diff rather than appearing silently at the next build.
#   - Builds are reproducible and faster: no codegen on every clean build, and
#     no dependence on which protoc happened to be installed.
#
# Regenerate with `cargo xtask gen-proto`, which is also what CI checks.

clean: true

managed:
  enabled: true

plugins:
  - local: protoc-gen-prost
    out: crates/platform/telividb-buffers/src/generated/protobuf
    opt:
      # Well-known types are left to `prost-types`, which prost maps by
      # default. Compiling them locally emits paths relative to the output
      # root, and those break once the file is included inside a module.
      - bytes=.
      # `bytes=.` maps every `bytes` field onto `Bytes` rather than `Vec<u8>`,
      # so a vector arriving over the wire can be sliced without a copy.

  - local: protoc-gen-tonic
    out: crates/platform/telividb-buffers/src/generated/protobuf
    opt:
      - no_include

  # MCP servers, one per service, generated from the same annotations the gRPC
  # surface already carries. Emitting MCP is generated from the descriptor set
  # and never hand-built, so the tool surface an agent sees cannot drift from
  # the API it exposes — they are the same definition rendered twice.
  #
  # A tool's description comes from the RPC's own doc comment unless
  # `(mcp.tool)` overrides it, which is why the protos carry no duplicated
  # prose: the comment a reader gets and the description an agent gets are the
  # same sentence.
  - local: protoc-gen-mcp
    out: crates/platform/telividb-buffers/src/generated/mcp
    opt:
      - lang=rust
      - paths=source_relative
