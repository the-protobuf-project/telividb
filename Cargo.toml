[workspace]
resolver = "3"
members = [
    "crates/domain/*",
    "crates/adapters/*",
    "crates/platform/*",
    "crates/bin/*",
    "tools/*",
]

# The engine is AGPL-3.0-or-later; commercial licences are available for
# proprietary use — see LICENSE-COMMERCIAL.md.
#
# Client SDKs and generated proto code override this with Apache-2.0, so that
# writing a proprietary application that *talks to* telividb needs no licence.
# Those crates set `license = "Apache-2.0"` in their own manifest.
[workspace.package]
version = "0.1.0"
edition = "2024"
# Pinned exactly; see rust-toolchain.toml.
rust-version = "1.98.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oh-tarnished/telividb"

[workspace.dependencies]
telividb-core       = { path = "crates/domain/telividb-core" }
telividb-distance   = { path = "crates/adapters/telividb-distance" }
telividb-index      = { path = "crates/adapters/telividb-index" }
telividb-storage    = { path = "crates/adapters/telividb-storage" }
telividb-telemetry  = { path = "crates/platform/telividb-telemetry" }
telividb-proto      = { path = "crates/platform/telividb-proto" }

# The observability stack for the whole workspace. Pinned to a tag so a push
# upstream cannot change this build; declared once here so every crate that
# emits telemetry agrees on the version.
telemetry = { git = "https://github.com/the-protobuf-project/telemetry", tag = "v1.1.0" }
thiserror = "2"

# Tests are compiled optimized.
#
# Much of this workspace is numeric — k-means over 256 centroids, HNSW graph
# construction, distance kernels over millions of pairs — and unoptimized that
# is roughly ninety times slower. The PQ codebook suite alone runs in 12s debug
# against 0.13s release.
#
# The extra compile time is paid once per change; the runtime saving is paid on
# every test run, on every platform in the matrix.
[profile.test]
opt-level = 2

# Dependencies are optimized even in a debug build, for the same reason: the
# protobuf and hashing crates sit on hot paths in the tests.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
