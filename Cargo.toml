[workspace]
resolver = "3"
members = [
    "crates/domain/*",
    "crates/adapters/*",
    "crates/platform/*",
    "crates/bin/*",
    "crates/sdk/*",
    "tools/*",
    "examples/rust",
]

# The desktop app is packaging, not architecture (CLAUDE.md's gotchas), and it
# is excluded from the workspace for two concrete reasons rather than taste:
#
#   - It needs GTK/webkit system libraries that CI runners do not carry, so
#     `cargo build --workspace` fails on Linux for a reason unrelated to the
#     database.
#   - Tauri drags `cc` in through `tauri-build`, `embed-resource` and
#     `tauri-winres`, which is a third native path invariant 1 does not
#     sanction — and sanctioning a GUI toolchain to keep a workspace glob tidy
#     would gut the rule.
#
# It still builds: `cargo build --manifest-path app/src-tauri/Cargo.toml`, or
# through the Tauri CLI, which is how a Tauri app is normally driven anyway.
exclude = ["app/src-tauri"]

# The engine is AGPL-3.0-or-later; commercial licences are available for
# proprietary use — see LICENSE-COMMERCIAL.md.
#
# Client SDKs and generated proto code override this with Apache-2.0, so that
# writing a proprietary application that *talks to* telividb needs no licence.
# Those crates set `license = "Apache-2.0"` in their own manifest.
[workspace.package]
version = "0.1.0"
edition = "2024"
# Pinned exactly; see rust-toolchain.toml.
rust-version = "1.98.0"
license = "AGPL-3.0-or-later"
repository = "https://github.com/oh-tarnished/telividb"

[workspace.dependencies]
telividb-client     = { path = "crates/sdk/telividb-client" }
telividb-core       = { path = "crates/domain/telividb-core" }
telividb-graph      = { path = "crates/domain/telividb-graph" }
telividb-distance   = { path = "crates/adapters/telividb-distance" }
telividb-embed      = { path = "crates/adapters/telividb-embed" }
telividb-index      = { path = "crates/adapters/telividb-index" }
telividb-storage    = { path = "crates/adapters/telividb-storage" }
telividb-telemetry  = { path = "crates/platform/telividb-telemetry" }
telividb-proto      = { path = "crates/platform/telividb-proto" }
telividb-server     = { path = "crates/bin/telividb-server" }

# The observability stack for the whole workspace. Pinned to a tag so a push
# upstream cannot change this build; declared once here so every crate that
# emits telemetry agrees on the version.
telemetry = { git = "https://github.com/the-protobuf-project/telemetry", tag = "v1.1.0" }
thiserror = "2"
# Plan A1.1's in-memory graph (CLAUDE.md rule 47). `Graph`, not `GraphMap`: a
# GraphMap keys nodes by weight and allows at most one edge per pair, and two
# points can carry more than one edge type between them.
petgraph = "0.8"
# Small mutable metadata — the graph's persisted edges today, meta.redb's
# other tables later. Pure Rust, ACID, no C dependency (CLAUDE.md invariant 1).
redb = "4"
# GGUF read/write and GPU tensor compute, both in pure Rust. Optional
# everywhere it appears: only the `gpu` feature of telividb-index pulls it in,
# so a default build carries none of it. Metal and CUDA are candle's own
# feature flags, selected by whichever composition root wants them.
candle-core = { version = "0.11", default-features = false }

# Tests are compiled optimized.
#
# Much of this workspace is numeric — k-means over 256 centroids, HNSW graph
# construction, distance kernels over millions of pairs — and unoptimized that
# is roughly ninety times slower. The PQ codebook suite alone runs in 12s debug
# against 0.13s release.
#
# The extra compile time is paid once per change; the runtime saving is paid on
# every test run, on every platform in the matrix.
[profile.test]
opt-level = 2

# Dependencies are optimized even in a debug build, for the same reason: the
# protobuf and hashing crates sit on hot paths in the tests.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
